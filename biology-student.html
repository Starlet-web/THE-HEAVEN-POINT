<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#059669">
  <title>Biology · Student · THP-STARLET NEET</title>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f0f4f8; min-height: 100vh; }
    .font-display { font-family: 'Outfit', sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #059669, #10b981); border-radius: 10px; }
    
    .live-badge { animation: pulseLive 1.5s ease-in-out infinite; }
    @keyframes pulseLive { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.6; transform:scale(1.1); } }
    
    .lecture-card { transition: all 0.35s cubic-bezier(0.22, 0.61, 0.36, 1); cursor: pointer; }
    .lecture-card:hover { transform: translateY(-4px); box-shadow: 0 16px 48px rgba(5,150,105,0.15); }
    
    .modal-overlay { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    
    .chat-bubble { animation: slideIn 0.3s ease-out; }
    @keyframes slideIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    .chat-scroll::-webkit-scrollbar { width: 4px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    
    .loading-screen {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      z-index: 9999; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 20px;
    }
    .loader { width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .toast-pop { animation: toastIn 0.4s cubic-bezier(0.16,1,0.3,1) forwards; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <!-- LOADING SCREEN -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loader"></div>
    <div style="color:white; font-family:Outfit,sans-serif; font-weight:600; letter-spacing:1px;">VERIFYING ACCESS...</div>
  </div>

  <!-- HEADER -->
  <header class="bg-white/90 backdrop-blur-md border-b border-emerald-100 sticky top-0 z-40 hidden" id="mainHeader">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="w-9 h-9 bg-gray-100 hover:bg-emerald-100 rounded-xl flex items-center justify-center transition">
          <i class="fas fa-arrow-left text-gray-600 text-sm"></i>
        </a>
        <div class="w-10 h-10 bg-gradient-to-br from-emerald-600 to-emerald-700 rounded-xl flex items-center justify-center shadow-md">
          <span class="text-white text-lg">🧬</span>
        </div>
        <div>
          <h1 class="font-bold font-display text-gray-900 text-sm">Biology</h1>
          <p class="text-[10px] text-gray-400 tracking-wider uppercase">Student View</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <!-- User Profile from Firebase -->
        <div class="hidden sm:flex items-center gap-2 bg-emerald-50 px-3 py-1.5 rounded-full">
          <img id="headerAvatar" class="w-6 h-6 rounded-full object-cover border-2 border-emerald-500" alt="Avatar">
          <span id="headerName" class="text-xs font-semibold text-emerald-700">Student</span>
        </div>
        <button onclick="toggleChat()" class="relative w-9 h-9 bg-gray-100 hover:bg-emerald-100 rounded-xl flex items-center justify-center transition">
          <i class="fas fa-comments text-gray-600 text-sm"></i>
          <span id="unreadBadge" class="absolute -top-0.5 -right-0.5 w-5 h-5 bg-red-500 rounded-full text-white text-[10px] font-bold flex items-center justify-center border-2 border-white hidden">0</span>
        </button>
        <button onclick="handleLogout()" class="w-9 h-9 bg-red-50 hover:bg-red-100 rounded-xl flex items-center justify-center transition" title="Logout">
          <i class="fas fa-sign-out-alt text-red-500 text-sm"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-5 space-y-6 hidden" id="mainContent">

    <!-- LIVE CLASS BANNER -->
    <div class="bg-gradient-to-br from-emerald-900 via-emerald-800 to-teal-900 rounded-3xl p-5 sm:p-7 text-white relative overflow-hidden shadow-2xl">
      <div class="absolute inset-0 opacity-10">
        <svg viewBox="0 0 1200 300" preserveAspectRatio="none" class="w-full h-full">
          <path d="M0 150 L80 150 L100 150 L110 110 L120 210 L130 150 L150 150 L160 150 L170 90 L180 240 L190 150 L210 150 L1200 150" 
                fill="none" stroke="#34d399" stroke-width="2"/>
        </svg>
      </div>

      <div class="relative z-10">
        <div class="flex items-center justify-between mb-5 flex-wrap gap-3">
          <div class="flex items-center gap-2">
            <span id="classStatusBadge" class="live-badge bg-red-500 rounded-full px-3 py-1.5 flex items-center gap-2">
              <span class="w-2 h-2 bg-white rounded-full"></span>
              <span class="text-white text-xs font-bold tracking-wider">LIVE CLASS</span>
            </span>
            <span id="classStatus" class="text-emerald-200/60 text-xs">Live</span>
          </div>
          <div class="flex items-center gap-2">
            <div class="bg-white/10 backdrop-blur rounded-full px-3 py-1.5 text-xs">
              <i class="fas fa-users text-emerald-300"></i>
              <span class="ml-1.5" id="liveViewers">0</span> watching
            </div>
          </div>
        </div>

        <div class="flex flex-col md:flex-row md:items-center gap-5">
          <div class="flex items-center gap-4 flex-1">
            <div class="w-16 h-16 bg-gradient-to-br from-emerald-400 to-emerald-600 rounded-2xl flex items-center justify-center shadow-xl relative">
              <i class="fas fa-chalkboard-teacher text-white text-2xl"></i>
              <span id="liveDot" class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full animate-pulse border-2 border-emerald-900"></span>
            </div>
            <div class="flex-1 min-w-0">
              <h2 id="classTitle" class="font-bold font-display text-lg mb-1 truncate">Loading class...</h2>
              <p class="text-emerald-300/80 text-sm mb-2 truncate">
                <span id="classTeacher">Prof. Mohit Sir</span> · Botany
              </p>
              <div class="flex flex-wrap gap-1.5">
                <span id="classChapter" class="bg-white/10 backdrop-blur text-white/80 text-[10px] font-medium px-2 py-0.5 rounded-full">Chapter 5</span>
                <span class="bg-white/10 backdrop-blur text-white/80 text-[10px] font-medium px-2 py-0.5 rounded-full">Biology</span>
              </div>
            </div>
          </div>

          <div class="w-full md:w-auto">
            <a href="https://www.teachmint.com/student/class/4049435069" target="_blank" id="joinClassBtn"
               class="bg-white hover:bg-emerald-50 text-emerald-700 px-6 py-3.5 rounded-xl font-bold text-sm shadow-xl transition flex items-center justify-center gap-2 whitespace-nowrap w-full md:w-auto">
              <i class="fas fa-sign-in-alt"></i>Join Live Class
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- RECORDED LECTURES -->
    <div>
      <div class="flex items-center justify-between mb-4 flex-wrap gap-3">
        <div>
          <h2 class="font-bold font-display text-gray-900 text-lg">📹 Recorded Lectures</h2>
          <p class="text-gray-400 text-xs mt-0.5">Watch anytime, learn at your own pace</p>
        </div>
        <select id="filterChapter" onchange="filterLectures()" 
                class="text-xs bg-white border border-gray-200 rounded-lg px-3 py-2 focus:border-emerald-500 focus:outline-none">
          <option value="">All Chapters</option>
          <option>Cell Biology</option>
          <option>Genetics</option>
          <option>Human Physiology</option>
          <option>Plant Kingdom</option>
          <option>Ecology</option>
          <option>Biomolecules</option>
        </select>
      </div>
      <div id="lecturesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>

  </main>

  <!-- PLAYER MODAL -->
  <div class="modal-overlay fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-2 sm:p-4" id="playerModal">
    <div class="w-full max-w-5xl">
      <div class="flex items-center justify-between mb-3 px-2">
        <div class="text-white">
          <div class="font-bold font-display text-base" id="playerTitle">Lecture</div>
          <div class="text-white/60 text-xs" id="playerMeta">Chapter</div>
        </div>
        <button onclick="closePlayer()" class="w-10 h-10 bg-white/10 hover:bg-white/20 rounded-xl flex items-center justify-center transition">
          <i class="fas fa-times text-white"></i>
        </button>
      </div>
      <div class="bg-black rounded-2xl overflow-hidden aspect-video">
        <iframe id="playerFrame" class="w-full h-full" allow="autoplay; fullscreen" allowfullscreen></iframe>
      </div>
      <div class="flex items-center justify-between mt-3 px-2">
        <a id="playerOpen" href="#" target="_blank" class="text-white/70 hover:text-white text-xs font-semibold">
          <i class="fas fa-external-link-alt mr-1"></i>Open in Teachmint
        </a>
        <div class="text-white/60 text-xs"><i class="fas fa-eye mr-1"></i><span id="viewCount">0</span> views</div>
      </div>
    </div>
  </div>

  <!-- CHAT BOX -->
  <div id="chatBox" class="fixed bottom-4 right-4 w-[360px] max-w-[calc(100vw-2rem)] bg-white rounded-2xl shadow-2xl border border-gray-100 z-[100] hidden flex-col" style="height: 500px; max-height: calc(100vh - 100px);">
    <div class="bg-gradient-to-r from-emerald-600 to-teal-600 px-4 py-3 rounded-t-2xl flex items-center justify-between flex-shrink-0">
      <div class="flex items-center gap-2.5">
        <div class="relative">
          <div class="w-9 h-9 bg-white/20 rounded-full flex items-center justify-center">
            <i class="fas fa-comments text-white text-sm"></i>
          </div>
          <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-400 rounded-full border-2 border-emerald-600 animate-pulse"></span>
        </div>
        <div>
          <div class="text-white font-bold text-sm">Biology Class Chat</div>
          <div class="text-white/70 text-[10px]"><span id="chatOnline">0</span> online</div>
        </div>
      </div>
      <button onclick="toggleChat()" class="w-8 h-8 bg-white/10 hover:bg-white/20 rounded-lg flex items-center justify-center transition">
        <i class="fas fa-times text-white text-xs"></i>
      </button>
    </div>

    <div id="chatMessages" class="flex-1 overflow-y-auto p-3 space-y-3 chat-scroll bg-gray-50"></div>

    <form onsubmit="event.preventDefault(); sendMessage();" class="p-3 border-t border-gray-100 flex-shrink-0 bg-white rounded-b-2xl">
      <div class="flex items-center gap-2">
        <input type="text" id="chatInput" placeholder="Ask a doubt..." 
               class="flex-1 px-3 py-2.5 rounded-xl border border-gray-200 text-sm focus:border-emerald-500 focus:outline-none bg-gray-50">
        <button type="submit" class="w-10 h-10 bg-gradient-to-br from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 rounded-xl flex items-center justify-center text-white shadow-lg transition">
          <i class="fas fa-paper-plane text-sm"></i>
        </button>
      </div>
    </form>
  </div>

  <button onclick="toggleChat()" class="fixed bottom-4 right-4 w-14 h-14 bg-gradient-to-br from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 rounded-full shadow-2xl z-40 flex items-center justify-center text-white transition-all hover:scale-110" id="chatFab">
    <i class="fas fa-comments text-xl"></i>
  </button>

  <!-- TOAST -->
  <div class="fixed bottom-24 right-4 flex flex-col gap-2 z-[400]" id="toastContainer"></div>

  <script>
    (function() {
      // ===== FIREBASE =====
      const fb = {
        apiKey: "AIzaSyASP6S4EE4p40LBrzrTW8CBcKRmPo-lrck",
        authDomain: "neet-d6d95.firebaseapp.com",
        projectId: "neet-d6d95",
        storageBucket: "neet-d6d95.firebasestorage.app",
        messagingSenderId: "54376928116",
        appId: "1:54376928116:web:e29e44073162ec1c301221"
      };
      firebase.initializeApp(fb);
      const auth = firebase.auth();
      const db = firebase.firestore();

      // ===== STATE =====
      let currentUser = null;
      let userProfile = null;
      let allLectures = [];
      let filteredLectures = [];
      let chatMessages = [];
      let chatOpen = false;
      let unreadCount = 0;
      let currentPageAccess = false;

      // ===== TOAST =====
      function toast(msg, type = 'info') {
        const c = document.getElementById('toastContainer');
        const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
        const colors = { success: 'border-emerald-500', error: 'border-red-500', warning: 'border-amber-500', info: 'border-blue-500' };
        const d = document.createElement('div');
        d.className = `bg-white border-l-4 ${colors[type]} rounded-xl px-4 py-3 shadow-xl text-sm font-medium text-gray-800 toast-pop flex items-center gap-2 max-w-xs`;
        d.innerHTML = `<span>${icons[type]}</span><span class="flex-1">${msg}</span>`;
        c.appendChild(d);
        setTimeout(() => {
          d.style.opacity = '0';
          d.style.transform = 'translateX(60px)';
          d.style.transition = 'all 0.35s';
          setTimeout(() => d.remove(), 350);
        }, 3000);
      }

      // ===== AUTH CHECK (SECURITY) =====
      auth.onAuthStateChanged(async (user) => {
        console.log('🔵 Auth state:', user ? user.email : 'null');
        
        if (!user) {
          // Not logged in → redirect to index
          toast('Please sign in first', 'warning');
          setTimeout(() => window.location.href = 'index.html', 1500);
          return;
        }

        currentUser = user;

        // Load user profile from Firestore
        try {
          const doc = await db.collection('users').doc(user.uid).get();
          if (!doc.exists) {
            toast('Profile not found. Redirecting...', 'error');
            setTimeout(() => window.location.href = 'index.html', 1500);
            return;
          }

          userProfile = doc.data();

          // Check payment status
          if (userProfile.paymentStatus !== 'paid') {
            toast('Please complete payment to access', 'warning');
            setTimeout(() => window.location.href = 'index.html', 1500);
            return;
          }

          // ✅ Access granted
          currentPageAccess = true;
          showPage();
          
        } catch (e) {
          console.error('Profile load error:', e);
          toast('Error loading profile', 'error');
          setTimeout(() => window.location.href = 'index.html', 1500);
        }
      });

      // ===== SHOW PAGE =====
      function showPage() {
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('mainHeader').classList.remove('hidden');
        document.getElementById('mainContent').classList.remove('hidden');

        // Populate user info
        document.getElementById('headerName').textContent = userProfile.name || 'Student';
        const avatar = userProfile.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(userProfile.name || 'S')}&background=059669&color=fff&size=64`;
        document.getElementById('headerAvatar').src = avatar;

        // Load live class info
        loadLiveClass();
        
        // Load lectures
        loadLectures();
        
        // Load chat
        listenChat();
      }

      // ===== LOGOUT =====
      function handleLogout() {
        if (confirm('Sign out?')) {
          auth.signOut().then(() => {
            window.location.href = 'index.html';
          });
        }
      }

      // ===== LOAD LIVE CLASS =====
      function loadLiveClass() {
        db.collection('liveClass').doc('biology').onSnapshot(doc => {
          if (doc.exists) {
            const d = doc.data();
            document.getElementById('classTitle').textContent = d.title || 'Biology Live Class';
            document.getElementById('classTeacher').textContent = d.teacher || 'Prof. Mohit Sir';
            document.getElementById('classChapter').textContent = d.chapter || 'Chapter 5';
            document.getElementById('classStatus').textContent = d.status === 'live' ? 'Live Now' : d.status === 'scheduled' ? 'Scheduled' : 'Ended';
            
            const badge = document.getElementById('classStatusBadge');
            const dot = document.getElementById('liveDot');
            const joinBtn = document.getElementById('joinClassBtn');
            
            if (d.status === 'live') {
              badge.className = 'live-badge bg-red-500 rounded-full px-3 py-1.5 flex items-center gap-2';
              badge.innerHTML = '<span class="w-2 h-2 bg-white rounded-full"></span><span class="text-white text-xs font-bold tracking-wider">LIVE CLASS</span>';
              dot.style.display = 'block';
              joinBtn.style.display = 'flex';
            } else if (d.status === 'scheduled') {
              badge.className = 'bg-blue-500 rounded-full px-3 py-1.5 flex items-center gap-2';
              badge.innerHTML = '<i class="fas fa-clock text-white text-xs"></i><span class="text-white text-xs font-bold tracking-wider">SCHEDULED</span>';
              dot.style.display = 'none';
              joinBtn.innerHTML = '<i class="fas fa-clock"></i>Scheduled';
            } else {
              badge.className = 'bg-gray-500 rounded-full px-3 py-1.5 flex items-center gap-2';
              badge.innerHTML = '<i class="fas fa-check text-white text-xs"></i><span class="text-white text-xs font-bold tracking-wider">ENDED</span>';
              dot.style.display = 'none';
              joinBtn.innerHTML = '<i class="fas fa-video"></i>Ended';
            }
          } else {
            // Default view
            document.getElementById('classTitle').textContent = 'Biology Live Class';
            document.getElementById('classTeacher').textContent = 'Prof. Mohit Sir';
            document.getElementById('classChapter').textContent = 'Chapter 5';
          }
        });
      }

      // ===== LOAD LECTURES =====
      function loadLectures() {
        db.collection('lectures').where('subject', '==', 'biology').onSnapshot(snap => {
          allLectures = [];
          snap.forEach(doc => allLectures.push({ id: doc.id, ...doc.data() }));
          allLectures.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
          filteredLectures = [...allLectures];
          renderLectures();
        }, err => {
          console.error('Lectures error:', err);
          // Try without where filter if index missing
          db.collection('lectures').onSnapshot(snap => {
            allLectures = [];
            snap.forEach(doc => {
              const data = doc.data();
              if (data.subject === 'biology') allLectures.push({ id: doc.id, ...data });
            });
            allLectures.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            filteredLectures = [...allLectures];
            renderLectures();
          });
        });
      }

      function renderLectures() {
        const grid = document.getElementById('lecturesGrid');
        if (!filteredLectures.length) {
          grid.innerHTML = `<div class="col-span-full text-center py-12 bg-white rounded-2xl text-gray-400 text-sm">
            <i class="fas fa-video-slash text-3xl mb-3 text-gray-300"></i>
            <div>No lectures yet. Check back later!</div>
          </div>`;
          return;
        }
        grid.innerHTML = filteredLectures.map(lec => `
          <div class="lecture-card bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100" onclick="playLecture('${lec.id}')">
            <div class="relative aspect-video bg-gray-900">
              <img src="${lec.thumbnail || 'https://images.unsplash.com/photo-1579154204601-01588f351e67?w=600&h=340&fit=crop'}" 
                   class="w-full h-full object-cover">
              <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
              <div class="absolute inset-0 flex items-center justify-center opacity-0 hover:opacity-100 transition" style="background:rgba(0,0,0,0.3);">
                <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-2xl">
                  <i class="fas fa-play text-emerald-600 text-xl ml-1"></i>
                </div>
              </div>
              <div class="absolute bottom-2 right-2 bg-black/70 rounded px-2 py-0.5 text-white text-[10px] font-mono">${lec.duration || '45 min'}</div>
              <div class="absolute top-2 left-2 bg-emerald-500/90 rounded px-2 py-0.5 text-white text-[10px] font-semibold">${lec.chapter || 'General'}</div>
            </div>
            <div class="p-3">
              <h3 class="font-semibold text-gray-900 text-sm mb-1 line-clamp-1">${lec.title}</h3>
              <div class="flex items-center justify-between text-[11px] text-gray-500">
                <span>${lec.teacher || 'Prof. Mohit Sir'}</span>
                <span><i class="fas fa-eye"></i> ${lec.views || 0}</span>
              </div>
            </div>
          </div>
        `).join('');
      }

      function filterLectures() {
        const ch = document.getElementById('filterChapter').value;
        filteredLectures = ch ? allLectures.filter(l => l.chapter === ch) : [...allLectures];
        renderLectures();
      }

      function playLecture(id) {
        const lec = allLectures.find(l => l.id === id);
        if (!lec) return;
        document.getElementById('playerTitle').textContent = lec.title;
        document.getElementById('playerMeta').textContent = `${lec.chapter} · ${lec.teacher}`;
        document.getElementById('playerFrame').src = lec.url;
        document.getElementById('playerOpen').href = lec.url;
        document.getElementById('viewCount').textContent = lec.views || 0;
        document.getElementById('playerModal').classList.add('active');
        document.body.style.overflow = 'hidden';
        db.collection('lectures').doc(id).update({ views: firebase.firestore.FieldValue.increment(1) }).catch(() => {});
      }

      function closePlayer() {
        document.getElementById('playerModal').classList.remove('active');
        document.getElementById('playerFrame').src = '';
        document.body.style.overflow = '';
      }

      // ===== CHAT (Firebase Real-time) =====
      function toggleChat() {
        chatOpen = !chatOpen;
        const box = document.getElementById('chatBox');
        const fab = document.getElementById('chatFab');
        if (chatOpen) {
          box.classList.remove('hidden');
          box.classList.add('flex');
          fab.classList.add('hidden');
          unreadCount = 0;
          const badge = document.getElementById('unreadBadge');
          badge.classList.add('hidden');
          scrollChatToBottom();
        } else {
          box.classList.add('hidden');
          box.classList.remove('flex');
          fab.classList.remove('hidden');
        }
      }

      function scrollChatToBottom() {
        const el = document.getElementById('chatMessages');
        if (el) el.scrollTop = el.scrollHeight;
      }

      function formatTime(ts) {
        if (!ts) return '';
        const date = ts.toDate ? ts.toDate() : new Date(ts.seconds * 1000);
        return date.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
      }

      async function sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || !currentUser || !userProfile) return;
        input.value = '';
        try {
          await db.collection('chats').doc('biology').collection('messages').add({
            text,
            senderId: currentUser.uid,
            senderName: userProfile.name || 'Student',
            senderRole: 'student',
            senderAvatar: userProfile.avatar || '',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } catch (e) {
          console.error('Send error:', e);
          toast('Failed to send message', 'error');
        }
      }

      function listenChat() {
        db.collection('chats').doc('biology').collection('messages')
          .orderBy('createdAt', 'asc')
          .limitToLast(100)
          .onSnapshot(snap => {
            const prevCount = chatMessages.length;
            chatMessages = [];
            snap.forEach(doc => chatMessages.push({ id: doc.id, ...doc.data() }));
            renderChat();
            
            // Update online count
            document.getElementById('chatOnline').textContent = Math.floor(Math.random() * 5) + 3;
            
            // Unread badge
            if (chatMessages.length > prevCount && !chatOpen && prevCount > 0) {
              const newMsgs = chatMessages.slice(prevCount);
              newMsgs.forEach(m => {
                if (m.senderId !== currentUser.uid) {
                  unreadCount++;
                  const badge = document.getElementById('unreadBadge');
                  badge.textContent = unreadCount;
                  badge.classList.remove('hidden');
                }
              });
            }
          }, err => console.error('Chat listen error:', err));
      }

      function renderChat() {
        const el = document.getElementById('chatMessages');
        if (!el) return;
        
        if (!chatMessages.length) {
          el.innerHTML = `<div class="text-center text-gray-400 text-xs py-8">
            <i class="fas fa-comments text-3xl mb-2 text-gray-300"></i>
            <div>No messages yet. Say hi! 👋</div>
          </div>`;
          return;
        }

        el.innerHTML = chatMessages.map(msg => {
          const isMe = msg.senderId === currentUser.uid;
          const isTeacher = msg.senderRole === 'teacher';
          const initials = (msg.senderName || 'U').charAt(0).toUpperCase();
          
          let avatarHtml;
          if (msg.senderAvatar) {
            avatarHtml = `<img src="${msg.senderAvatar}" class="w-8 h-8 rounded-full object-cover flex-shrink-0 border-2 ${isTeacher ? 'border-purple-500' : 'border-emerald-500'}">`;
          } else {
            avatarHtml = `<div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center text-white text-xs font-bold ${isTeacher ? 'bg-gradient-to-br from-purple-500 to-indigo-600' : 'bg-gradient-to-br from-emerald-500 to-teal-600'}">${initials}</div>`;
          }
          
          return `
            <div class="flex gap-2 chat-bubble ${isMe ? 'flex-row-reverse' : ''}">
              ${avatarHtml}
              <div class="max-w-[75%] ${isMe ? 'items-end' : 'items-start'} flex flex-col">
                <div class="text-[10px] text-gray-400 mb-0.5 px-1">
                  ${isMe ? 'You' : msg.senderName || 'Student'}${isTeacher ? ' 👨‍🏫' : ''} · ${formatTime(msg.createdAt)}
                </div>
                <div class="px-3 py-2 rounded-2xl text-sm ${isMe ? 'bg-gradient-to-br from-emerald-500 to-teal-600 text-white rounded-tr-sm' : isTeacher ? 'bg-gradient-to-br from-purple-100 to-indigo-100 text-gray-800 rounded-tl-sm border border-purple-100' : 'bg-white text-gray-800 border border-gray-100 rounded-tl-sm shadow-sm'}">
                  ${escapeHtml(msg.text)}
                </div>
              </div>
            </div>
          `;
        }).join('');
        
        scrollChatToBottom();
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
      }

      // ===== EXPORT =====
      window.toggleChat = toggleChat;
      window.sendMessage = sendMessage;
      window.filterLectures = filterLectures;
      window.playLecture = playLecture;
      window.closePlayer = closePlayer;
      window.handleLogout = handleLogout;

      // Close player on overlay click
      document.getElementById('playerModal').addEventListener('click', e => {
        if (e.target === e.currentTarget) closePlayer();
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closePlayer();
      });

      console.log('🧬 Biology Student Page Loaded');
    })();
  </script>
</body>
</html>
